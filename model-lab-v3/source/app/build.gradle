plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starik.modelviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.starik.modelviewer'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
