name: SoundPad temporary build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'soundpad/**'
      - '.github/workflows/soundpad-build.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p soundpad :app:assembleDebug --stacktrace

      - name: Upload APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: SoundPad-v5-debug
          path: soundpad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Boot emulator and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r soundpad/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.starik1917.soundpad2/.SplashActivity
            sleep 3
            adb shell pidof com.starik1917.soundpad2
            adb shell dumpsys activity activities | grep -q 'com.starik1917.soundpad2/.MainActivity'
