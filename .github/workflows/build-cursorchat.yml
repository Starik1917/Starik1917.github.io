name: Build CursorChat compact APK

on:
  push:
    branches: [ cursorchat-apk-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Restore Android project
        run: |
          cat cursorchat-project.zip.b64.part* > cursorchat-project.zip.b64
          base64 -d cursorchat-project.zip.b64 > cursorchat.zip
          unzip -q cursorchat.zip
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: CursorChatAPK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CursorChat-compact-debug
          path: CursorChatAPK/app/build/outputs/apk/debug/app-debug.apk
