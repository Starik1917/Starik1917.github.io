name: Temp Build AI Telegram Native APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-ai-telegram :app:assembleDebug --stacktrace
      - name: Verify native llama.cpp engine
        run: |
          set -e
          APK=android-ai-telegram/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libllama_jni.so'
          sha256sum "$APK" | tee android-ai-telegram/app/build/outputs/apk/debug/SHA256.txt
          cp "$APK" android-ai-telegram/app/build/outputs/apk/debug/AI-Telegram-Native-Vivo-X200-Ultra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Telegram-Native-Vivo-X200-Ultra
          path: |
            android-ai-telegram/app/build/outputs/apk/debug/AI-Telegram-Native-Vivo-X200-Ultra.apk
            android-ai-telegram/app/build/outputs/apk/debug/SHA256.txt
          retention-days: 7
