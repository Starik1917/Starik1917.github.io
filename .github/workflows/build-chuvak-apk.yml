name: Build Chuvak IDE APK
on:
  push:
    branches: [chuvak-code-android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Convert interpreter to native Chuvak syntax v0.2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/ru/starik/chuvakide/MiniInterpreter.java')
          s = p.read_text()
          s = s.replace('''        String source = rawSource;\n        if (ChuvakCodec.looksEncoded(source)) {\n            try { source = ChuvakCodec.decode(source); }\n            catch (IllegalArgumentException e) { throw new LangException(1, e.getMessage()); }\n        }\n        List<SourceLine> lines = preprocess(source);''', '''        String source = rawSource;\n        List<SourceLine> lines = preprocess(source);''')
          s = s.replace('line.text.startsWith("если ")', 'line.text.startsWith("чуувак ")')
          s = s.replace('line.text.substring(5, line.text.length() - 1).trim()', 'line.text.substring("чуувак ".length(), line.text.length() - 1).trim()', 1)
          s = s.replace('maybeElse.text.equals("иначе:")', 'maybeElse.text.equals("чуваак:")')
          s = s.replace('line.text.startsWith("пока ")', 'line.text.startsWith("чууувак ")')
          i = s.find('line.text.substring(5, line.text.length() - 1).trim()')
          if i >= 0:
              s = s[:i] + s[i:].replace('line.text.substring(5, line.text.length() - 1).trim()', 'line.text.substring("чууувак ".length(), line.text.length() - 1).trim()', 1)
          s = s.replace('line.text.equals("иначе:")', 'line.text.equals("чуваак:")')
          s = s.replace('t.startsWith("печать(")', 't.startsWith("чувак(")')
          s = s.replace('t.substring("печать(".length(), t.length() - 1)', 't.substring("чувак(".length(), t.length() - 1)')
          s = s.replace('while (matchWord("или"))', 'while (matchWord("чууваак"))')
          s = s.replace('while (matchWord("и"))', 'while (matchWord("чувакчувак"))')
          s = s.replace('if (matchWord("не"))', 'if (matchWord("чувауак"))')
          s = s.replace('if (matchWord("истина"))', 'if (matchWord("чуууувак"))')
          s = s.replace('if (matchWord("ложь"))', 'if (matchWord("чуваааак"))')
          s = s.replace('if (name.equals("длина"))', 'if (name.equals("чувааак"))')
          s = s.replace('"длина() работает со строками и списками"', '"чувааак() работает со строками и списками"')
          required = ['startsWith("чуувак ")', 'startsWith("чууувак ")', 'startsWith("чувак(")', 'matchWord("чувакчувак")', 'matchWord("чууваак")', 'matchWord("чувауак")', 'matchWord("чуууувак")', 'matchWord("чуваааак")', 'name.equals("чувааак")']
          for x in required:
              if x not in s:
                  raise RuntimeError('missing interpreter token: ' + x)
          p.write_text(s)

          p = Path('app/src/main/java/ru/starik/chuvakide/MainActivity.java')
          s = p.read_text()
          s = s.replace('getSharedPreferences("chuvak_ide", MODE_PRIVATE)', 'getSharedPreferences("chuvak_ide_v2", MODE_PRIVATE)')

          constants = '''    private static final String HELLO = "# chuvak-code v0.2\\nчувак(\\"hello, chuvak!\\")\\nчувак(1917)";\n    private static final String LOOP = "x = 1\\nчууувак x <= 5:\\n    чувак(\\"chuvak #\\" + x)\\n    x = x + 1\\nчувак(\\"done\\")";\n    private static final String IF_EXAMPLE = "score = 1917\\nчуувак score >= 1000:\\n    чувак(\\"mega chuvak\\")\\nчуваак:\\n    чувак(\\"more chuvak needed\\")";\n    private static final String LIST_EXAMPLE = "items = [1, 2, 3, 4]\\nчувак(items)\\nчувак(чувааак(items))";'''
          pattern = r'(?m)^    private static final String HELLO = .*?$\n^    private static final String LOOP = .*?$\n^    private static final String IF_EXAMPLE = .*?$\n^    private static final String LIST_EXAMPLE = .*?$'
          s, n = re.subn(pattern, lambda m: constants, s, count=1)
          if n != 1:
              raise RuntimeError('example constants not replaced')

          s = s.replace('TextView badge = text("PYTHON, НО ХУЖЕ", 10, MUTED, true);', 'TextView badge = text("CHUVAK LANG v0.2", 10, MUTED, true);')
          button_pattern = r'(?m)^        addButton\(tools, "▶ Запуск".*?$\n^        addButton\(tools, "→ Чувак".*?$\n^        addButton\(tools, "← Текст".*?$'
          s, n = re.subn(button_pattern, '        addButton(tools, "▶ Запуск", ACCENT, v -> runCode());\n        addButton(tools, "Синтаксис", PANEL2, v -> help());', s, count=1)
          if n != 1:
              raise RuntimeError('toolbar not replaced')
          s = s.replace('Пример загружен. Его можно кодировать кнопкой «→ Чувак» и запускать в обоих видах.', 'Пример загружен. Здесь команды уже написаны на чистом чувакском.')

          start = s.index('    private void help() {')
          end = s.index('    private void updateFileLabel()', start)
          help_method = '''    private void help() {\n        String msg = "ЧУВАК-КОД v0.2\\n\\n" +\n            "Это отдельный Python-подобный язык. Русских ключевых слов в исходнике больше нет.\\n\\n" +\n            "СИНТАКСИС\\n" +\n            "чувак(x)              print\\n" +\n            "чуувак условие:       if\\n" +\n            "чуваак:               else\\n" +\n            "чууувак условие:      while\\n" +\n            "чувааак(x)            length\\n" +\n            "чуууувак              true\\n" +\n            "чуваааак              false\\n" +\n            "чувакчувак            and\\n" +\n            "чууваак               or\\n" +\n            "чувауак               not\\n\\n" +\n            "Переменные можно называть латиницей. Есть числа, строки, списки, + - * / %, == != < <= > >=. Блоки задаются отступами как в Python.\\n\\n" +\n            "Пример:\\n" +\n            "x = 1\\n" +\n            "чууувак x <= 3:\\n" +\n            "    чувак(x)\\n" +\n            "    x = x + 1\\n\\n" +\n            "Выполнение полностью локальное. Доступа к shell, сети и системным файлам у языка нет; цикл принудительно обрывается после 10 000 итераций.";\n        TextView body = text(msg, 14, Color.BLACK, false);\n        body.setTypeface(Typeface.MONOSPACE);\n        body.setPadding(dp(20), dp(8), dp(20), dp(8));\n        body.setTextIsSelectable(true);\n        ScrollView scroll = new ScrollView(this);\n        scroll.addView(body);\n        new AlertDialog.Builder(this).setTitle("Синтаксис чувак-кода").setView(scroll).setPositiveButton("чувак", null).show();\n    }\n\n'''
          s = s[:start] + help_method + s[end:]
          if 'чувак(\\"hello, chuvak!\\")' not in s or 'addButton(tools, "Синтаксис"' not in s:
              raise RuntimeError('UI patch verification failed')
          p.write_text(s)

          p = Path('app/build.gradle')
          s = p.read_text().replace('versionCode 1', 'versionCode 2').replace("versionName '0.1.0'", "versionName '0.2.0'")
          p.write_text(s)
          PY
      - name: Core syntax smoke test
        shell: bash
        run: |
          cat > TestCoreV2.java <<'JAVA'
          import ru.starik.chuvakide.*;
          public class TestCoreV2 {
            public static void main(String[] args) throws Exception {
              String src = "x = 0\nчууувак x < 3:\n    чувак(\"chuvak \" + x)\n    x = x + 1\nчуувак x == 3:\n    чувак(\"done\")\nчуваак:\n    чувак(\"broken\")";
              String got = new MiniInterpreter().run(src);
              if (!got.equals("chuvak 0\nchuvak 1\nchuvak 2\ndone\n")) throw new RuntimeException(got);
              String logic = "чуувак чуууувак чувакчувак чувауак чуваааак:\n    чувак(чувааак([1,2,3]))";
              if (!new MiniInterpreter().run(logic).equals("3\n")) throw new RuntimeException("logic failed");
            }
          }
          JAVA
          mkdir -p out-test
          javac -encoding UTF-8 -d out-test app/src/main/java/ru/starik/chuvakide/MiniInterpreter.java TestCoreV2.java
          java -cp out-test TestCoreV2
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChuvakIDE-v0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
