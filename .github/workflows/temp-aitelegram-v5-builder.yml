name: Temp Build AI Telegram v5 APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/aitelegram-v5-no-think-20260807
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Patch leaked model control tokens
        run: |
          python3 scripts/patch_no_think.py
          SRC=android-ai-telegram/app/src/main/java/com/starik1917/aitelegramnative/AutoReplyService.kt
          if grep -n '/no_think' "$SRC"; then
            echo 'ERROR: /no_think still present in runtime source'
            exit 1
          fi
          grep -n 'containsControlToken' "$SRC"
      - name: Build debug APK
        run: gradle -p android-ai-telegram :app:assembleDebug --stacktrace
      - name: Verify and encode APK
        run: |
          set -e
          APK=android-ai-telegram/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libllama_jni.so'
          mkdir -p build-output
          cp "$APK" build-output/AI-Telegram-v5-NoThink-Fix.apk
          sha256sum build-output/AI-Telegram-v5-NoThink-Fix.apk > build-output/SHA256.txt
          base64 -w 0 build-output/AI-Telegram-v5-NoThink-Fix.apk > build-output/AI-Telegram-v5-NoThink-Fix.apk.b64
          rm build-output/AI-Telegram-v5-NoThink-Fix.apk
      - name: Publish encoded build to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/AI-Telegram-v5-NoThink-Fix.apk.b64 build-output/SHA256.txt
          git commit -m "Publish AI Telegram v5 APK build" || exit 0
          git push origin HEAD:build/aitelegram-v5-no-think-20260807
