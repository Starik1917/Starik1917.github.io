name: Build Model Viewer APK

on:
  push:
    branches:
      - build/model-viewer-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            model-viewer-build/payload/part00.b64 \
            model-viewer-build/payload/part01.b64 \
            model-viewer-build/payload/part02.b64 \
            model-viewer-build/payload/part03a.b64 \
            model-viewer-build/payload/part03b.b64 \
            model-viewer-build/payload/part04a.b64 \
            model-viewer-build/payload/part04b.b64 \
            model-viewer-build/payload/part05.b64 \
            | base64 --decode > /tmp/model-viewer-project.zip
          echo "478515a2b6dba8661c9e39da8ea5b8dfa18efe3e81450d9b1b6f2624d4b6cae5  /tmp/model-viewer-project.zip" | sha256sum --check
          mkdir -p build-src
          unzip -q /tmp/model-viewer-project.zip -d build-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: build-src
        run: npm install --no-audit --no-fund

      - name: Bundle offline viewer
        working-directory: build-src
        run: npm run build:web

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelViewer3D-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
