name: Probe OrcaSlicer Android port

on:
  push:
    branches:
      - build/model-lab-v4-orca
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Model Lab
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch pinned OrcaSlicer build files
        shell: bash
        run: |
          set -euo pipefail
          mkdir orca
          cd orca
          git init
          git remote add origin https://github.com/OrcaSlicer/OrcaSlicer.git
          git sparse-checkout init --cone
          git sparse-checkout set deps cmake deps_src
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin e1c0ea0cc48a05bdf7e57bc4f3a0fe0b54370c46
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "e1c0ea0cc48a05bdf7e57bc4f3a0fe0b54370c46"

      - name: Restore Orca source download cache
        uses: actions/cache@v4
        with:
          path: orca/deps/DL_CACHE
          key: orca-dependency-downloads-e1c0ea0-v1

      - name: Remove desktop-only dependencies from Android graph
        shell: bash
        run: |
          set -euo pipefail
          python3 model-lab-v4/patches/patch_orca_deps_android.py orca

      - name: Configure upstream dependencies for Android
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmake/3.31.1/bin/cmake" \
            -S orca/deps \
            -B build/orca-deps \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DDESTDIR="$GITHUB_WORKSPACE/build/orca-prefix" \
            > /tmp/orca-configure.log 2>&1
          tail -n 120 /tmp/orca-configure.log

      - name: Upload configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-android-configure-log
          path: /tmp/orca-configure.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if upstream configure failed
        if: steps.configure.outcome == 'failure'
        shell: bash
        run: |
          echo "Upstream Orca dependency configuration is not Android-ready yet."
          exit 1

      - name: List Android dependency targets
        if: steps.configure.outcome == 'success'
        shell: bash
        run: ninja -C build/orca-deps -t targets all > /tmp/orca-targets.txt

      - name: Build first native dependency set
        id: dependency_build_1
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/orca-dependencies-stage1.log
          built=0
          for target in dep_ZLIB dep_EXPAT dep_Eigen dep_Cereal dep_TBB dep_Boost; do
            if grep -q "^${target}:" /tmp/orca-targets.txt; then
              echo "===== Building ${target} =====" | tee -a /tmp/orca-dependencies-stage1.log
              "$ANDROID_SDK_ROOT/cmake/3.31.1/bin/cmake" --build build/orca-deps \
                --target "$target" --parallel 2 \
                >> /tmp/orca-dependencies-stage1.log 2>&1
              built=$((built + 1))
            else
              echo "===== ${target} is provided by the toolchain or omitted =====" | tee -a /tmp/orca-dependencies-stage1.log
            fi
          done
          echo "External targets built: ${built}" | tee -a /tmp/orca-dependencies-stage1.log
          tail -n 160 /tmp/orca-dependencies-stage1.log

      - name: Build geometry and runtime dependencies
        id: dependency_build_2
        if: steps.dependency_build_1.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/orca-dependencies-stage2.log
          built=0
          for target in dep_PNG dep_Qhull dep_GMP dep_MPFR dep_CGAL dep_NLopt dep_libnoise dep_OpenSSL dep_JPEG; do
            if grep -q "^${target}:" /tmp/orca-targets.txt; then
              echo "===== Building ${target} =====" | tee -a /tmp/orca-dependencies-stage2.log
              "$ANDROID_SDK_ROOT/cmake/3.31.1/bin/cmake" --build build/orca-deps \
                --target "$target" --parallel 2 \
                >> /tmp/orca-dependencies-stage2.log 2>&1
              built=$((built + 1))
            else
              echo "===== ${target} is provided by the toolchain or omitted =====" | tee -a /tmp/orca-dependencies-stage2.log
            fi
          done
          echo "External targets built: ${built}" | tee -a /tmp/orca-dependencies-stage2.log
          tail -n 200 /tmp/orca-dependencies-stage2.log

      - name: Upload dependency build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-android-dependency-log
          path: |
            /tmp/orca-dependencies-stage1.log
            /tmp/orca-dependencies-stage2.log
            /tmp/orca-targets.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if dependency build failed
        if: steps.dependency_build_1.outcome == 'failure' || steps.dependency_build_2.outcome == 'failure'
        shell: bash
        run: |
          echo "At least one required Orca dependency is not Android-ready yet."
          exit 1

      - name: Verify Android dependency output
        if: steps.dependency_build_2.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          find build/orca-prefix -type f \( -name '*.a' -o -name '*.so' -o -name '*.h' \) | sed -n '1,260p'
          test "$(find build/orca-prefix -type f -name '*.a' | wc -l)" -gt 5
