name: Build AI Telegram Native APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch leaked model control tokens
        run: |
          python3 scripts/patch_no_think.py
          SRC=android-ai-telegram/app/src/main/java/com/starik1917/aitelegramnative/AutoReplyService.kt
          if grep -n '/no_think' "$SRC"; then
            echo 'ERROR: /no_think still present in runtime source'
            exit 1
          fi
          grep -n 'containsControlToken' "$SRC"

      - name: Build debug APK
        run: gradle -p android-ai-telegram :app:assembleDebug --stacktrace

      - name: Verify APK native engine
        run: |
          set -e
          APK=android-ai-telegram/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libllama_jni.so'
          sha256sum "$APK" | tee android-ai-telegram/app/build/outputs/apk/debug/SHA256.txt
          cp "$APK" android-ai-telegram/app/build/outputs/apk/debug/AI-Telegram-v5-NoThink-Fix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Telegram-v5-NoThink-Fix
          path: |
            android-ai-telegram/app/build/outputs/apk/debug/AI-Telegram-v5-NoThink-Fix.apk
            android-ai-telegram/app/build/outputs/apk/debug/SHA256.txt
          retention-days: 7
