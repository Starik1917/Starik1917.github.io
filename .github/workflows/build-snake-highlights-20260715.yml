name: Build Snake Q Highlights APK

on:
  push:
    branches:
      - build/snake-q-native-highlights-20260715
    paths-ignore:
      - SnakeQNative-v1.1-highlights-arm64.apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build/snake-q-native-highlights-20260715

      - name: Restore Android project
        shell: bash
        run: |
          set -euxo pipefail
          echo '2819ef3ae30d4a137fb9a57908b10d20a9a97136cedd6dc8d86965bdb1d441d3  snake-q-native-v2/part-00.b64' > expected.sha256
          echo 'df6778a241b343575107f11f4cc9912541fddedf79a1d978f4f0fe799aa09d93  snake-q-native-v2/part-01.b64' >> expected.sha256
          echo '4bb9c77b11c1d64abef56ec7e04ece70b7e671a327aee68b7b0607d53a6b1176  snake-q-native-v2/part-02.b64' >> expected.sha256
          echo 'dd70dcbd745bef0fee88e1893983aa23bb10db7ab39e066342b245193b2f0b51  snake-q-native-v2/part-03.b64' >> expected.sha256
          echo '645f7705bea201fbc3980b651ce3c6fec043b04987a042d029a5c421bc063989  snake-q-native-v2/part-04.b64' >> expected.sha256
          echo '711d31a6f60862b6c4f97a243462268536abdbd8372b78dd82456a2c67766bd2  snake-q-native-v2/part-05.b64' >> expected.sha256
          echo '05d1ff3a2fba0585964e21905f5d2a98cfa779f1370f639ebb29058d31b891e9  snake-q-native-v2/part-06.b64' >> expected.sha256
          echo '323253b7ad3ac737197a6026f540dae4984d1a41d47eb4a0ab38b14602981836  snake-q-native-v2/part-07.b64' >> expected.sha256
          wc -c snake-q-native-v2/part-*.b64
          sha256sum snake-q-native-v2/part-*.b64
          sha256sum -c expected.sha256
          rm -rf snake-build snake-source.zip
          cat snake-q-native-v2/part-*.b64 | base64 --decode > snake-source.zip
          echo '1ef43586a0632f8da54a281aeb6915029cb0717a7c877718cdc14f16928cf8c4  snake-source.zip' | sha256sum -c -
          mkdir snake-build
          unzip -q snake-source.zip -d snake-build

      - name: Verify source archive
        shell: bash
        run: |
          test -f snake-build/app/src/main/java/com/starik/snakeq/MainActivity.java
          test -f snake-build/app/src/main/cpp/snake_native.cpp
          grep -q 'nativeFillAgentDetails' snake-build/app/src/main/java/com/starik/snakeq/MainActivity.java
          grep -q 'kMaxHighlights' snake-build/app/src/main/cpp/snake_native.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: snake-build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and rename APK
        shell: bash
        run: |
          test -f snake-build/app/build/outputs/apk/debug/app-debug.apk
          cp snake-build/app/build/outputs/apk/debug/app-debug.apk SnakeQNative-v1.1-highlights-arm64.apk
          unzip -l SnakeQNative-v1.1-highlights-arm64.apk | grep -q 'lib/arm64-v8a/libsnakeq.so'
          sha256sum SnakeQNative-v1.1-highlights-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeQNative-Highlights-APK
          path: SnakeQNative-v1.1-highlights-arm64.apk
          if-no-files-found: error
          retention-days: 7
