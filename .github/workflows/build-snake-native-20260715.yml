name: Build Snake Q Native APK

on:
  push:
    branches:
      - build/snake-q-native-apk-20260715
    paths-ignore:
      - SnakeQNative-v1.0-arm64.apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          rm -rf snake-build snake-source.zip
          cat snake-q-native-src/part-*.b64 | base64 --decode > snake-source.zip
          mkdir snake-build
          unzip -q snake-source.zip -d snake-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: snake-build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and rename APK
        shell: bash
        run: |
          test -f snake-build/app/build/outputs/apk/debug/app-debug.apk
          cp snake-build/app/build/outputs/apk/debug/app-debug.apk SnakeQNative-v1.0-arm64.apk
          unzip -l SnakeQNative-v1.0-arm64.apk | grep -q 'lib/arm64-v8a/libsnakeq.so'
          sha256sum SnakeQNative-v1.0-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnakeQNative-APK
          path: SnakeQNative-v1.0-arm64.apk
          if-no-files-found: error
          retention-days: 7
