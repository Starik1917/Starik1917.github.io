plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starik.flydrive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.starik.flydrive'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        noCompress += ['bin']
    }
}
